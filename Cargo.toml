[package]
name = "matvec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
ark-crypto-primitives = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
blake3 = {version = "1.8.2", features = ["rayon"]}
rand = "0.9.1"
rand_core = "0.9.3"
rand_distr = "0.4.3"
rayon = "1.11.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
tfhe-ntt = "0.6.0"
whir = { git = "https://github.com/worldfnd/whir", rev = "655783c3b8466af34587d43f333ca967604e1954" }
# Not used directly: enables the `derive` feature on the `zerocopy` version WHIR
# depends on, via feature unification, so WHIR's zerocopy derives resolve.
zerocopy = { version = "0.8.33", features = ["derive"] }

[dev-dependencies]
criterion = "0.7.0"

[[bin]]
name = "matvec"
path = "src/bin/main.rs"

[[bench]]
name = "cyclotomic_ring_bench"
harness = false

[[bench]]
name = "functionality_bench"
harness = false
